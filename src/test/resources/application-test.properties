# ===============================
# TEST Profile Configuration (H2)
# ===============================

spring.datasource.url=jdbc:h2:mem:CyberScribeDB_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Flyway disabled for H2 tests (schema managed by Hibernate)
spring.flyway.enabled=false

# JWT
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLWp3dC1zaWduaW5nLWF0LWxlYXN0LTI1Ni1iaXRz
app.jwt.expiration-milliseconds=3600000
app.jwt.refresh-expiration-milliseconds=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.xoraus.cyberscribex=DEBUG

# Disable caching for tests
spring.cache.type=none
